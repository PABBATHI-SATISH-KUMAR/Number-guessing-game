<!DOCTYPE html>
<html>
<head>
	<title>Number Guessing Game</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>Number Guessing Game</h1>
	<p>Welcome to the number guessing game!</p>
	<p>In this game, you need to guess the secret number given by the system.</p>
	<input id="guess" type="number" min="1" max="100" placeholder="Guess a number between 1 and 100">
	<button id="submit" class="btn btn-primary">Submit</button>
	<p id="result"></p>
	<p id="score">Score: 0</p>
	<p id="timer">Time remaining: 60 seconds</p>
	<script src="script.js"></script>
</body>
</html>
